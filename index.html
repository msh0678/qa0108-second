<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="이 기기에만 저장되는 간단한 한 줄 메모장입니다">
  <title>한 줄 메모</title>
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>
  <main class="card">
    <h1>한 줄 메모</h1>
    <p class="desc">깜빡하기 전에 적어두는 작은 메모장입니다.</p>

    <label class="field-label" for="memoInput">메모 내용</label>
    <input type="text" id="memoInput" maxlength="100" placeholder="예: 우유 사기" autocomplete="off">

    <button type="button" id="saveBtn">저장하기</button>
    <p class="msg" id="msg" role="status"></p>

    <section class="saved" aria-live="polite">
      <h2>저장된 메모</h2>
      <p id="savedText">아직 저장된 메모가 없습니다.</p>
    </section>

    <p class="note">입력한 메모는 이 기기 브라우저에만 저장됩니다.</p>
  </main>
  <script src="./js/app.js"></script>

<!--ethos-badge--><div style="text-align:center;padding:16px 8px 20px;font:12px/1.6 -apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;color:#9aa1a9">이 페이지는 <a href="https://ethos.ai.kr" target="_blank" rel="noopener" style="color:#8a919b;text-decoration:underline">에토스AI 코드</a>로 만들어졌습니다</div>
</body>
</html>
